name: Deploy beta

# Deploy the beta branch's frontend to beta.honorum.app every day, or by
# hand. It shares production's backend, which deploys from main.
on:
  schedule:
    # 09:00 UTC: 4am in Oklahoma during daylight saving time, 3am otherwise.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          fetch-depth: 0
          persist-credentials: false
      - name: Find the beta commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm --prefix deploy/cloudflare ci
      - name: Stamp the edge release
        working-directory: deploy/cloudflare
        run: node scripts/release-config.mjs "${{ steps.commit.outputs.sha }}"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          packageManager: npm
          command: deploy --config wrangler.release.jsonc --env beta
      - name: Verify serving release
        working-directory: deploy/cloudflare
        run: node scripts/verify-release.mjs "${{ steps.commit.outputs.sha }}" https://beta.honorum.app
