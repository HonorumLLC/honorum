name: Deploy

# Deploy a tested main commit by hand. The local pre-push hook runs checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm --prefix deploy/cloudflare ci
      - name: Stamp the edge release
        working-directory: deploy/cloudflare
        run: node scripts/release-config.mjs "$GITHUB_SHA"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          packageManager: npm
          command: deploy --config wrangler.release.jsonc
      - name: Verify serving release
        working-directory: deploy/cloudflare
        run: node scripts/verify-release.mjs "$GITHUB_SHA"
