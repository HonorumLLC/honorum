services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: honorum
      POSTGRES_DB: honorum
      POSTGRES_PASSWORD: ${HONORUM_POSTGRES_PASSWORD:?Set a PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, honorum, -d, honorum]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  honorum:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config/schools.json:/app/config.json:ro
    environment:
      - HONORUM_DATABASE_URL=postgres://honorum:${HONORUM_POSTGRES_PASSWORD:?Set a PostgreSQL password}@postgres:5432/honorum?sslmode=disable
      - HONORUM_TWILIO_ACCOUNT_SID
      - HONORUM_TWILIO_AUTH_TOKEN
      - HONORUM_TWILIO_VERIFY_SERVICE_SID
      - HONORUM_CANVAS_KEY
    restart: unless-stopped
volumes:
  postgres-data:
