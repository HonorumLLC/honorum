#cloud-config
# provision.py substitutes a public SSH key, never application credentials.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, restic, unattended-upgrades]
ssh_pwauth: false
disable_root: true
users:
  - name: honorum-admin
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__
write_files:
  - path: /etc/ssh/sshd_config.d/00-honorum.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /usr/local/sbin/honorum-bootstrap
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' "$(dpkg --print-architecture)" "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      install -d -m 0700 /etc/honorum /var/lib/honorum/backup
      install -d -m 0755 /opt/honorum/releases
      sshd -t
      systemctl reload ssh
      touch /var/lib/honorum/bootstrap-complete
runcmd:
  - [/usr/local/sbin/honorum-bootstrap]
