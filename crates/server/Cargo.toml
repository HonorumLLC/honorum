[package]
name = "honorum-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
brotli = "9.0.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1", "serde"] }
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
honorum-catalog = { version = "0.1.0", path = "../catalog" }
http-body-util = "0.1.5"
memory-stats = { version = "1.2.0", optional = true }
nix = { version = "0.31.3", features = ["signal", "resource"], optional = true }
p256 = { version = "0.14.0", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "form", "gzip", "http2", "json", "query", "rustls", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1.0.9"

[dev-dependencies]
tower = "0.5.3"

[lints]
workspace = true

[features]
# Test support for this crate's tests and the lab binaries.
testing = []
# The development labs behind `honorum-lab`: the browser-suite server, the
# performance lab API, and the capacity lab. Never part of a release build.
lab = ["testing", "dep:nix", "dep:memory-stats"]
